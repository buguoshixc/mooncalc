<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>MoonCalc smoke</title></head>
<body>
<h1>MoonCalc headless smoke</h1>
<ul id="results"></ul>
<div id="done">RUNNING</div>
<script type="module">
import { loadEngine } from './loader.js';
import { parseCsv } from './csv.js';

const results = document.getElementById('results');
const done = document.getElementById('done');
let failures = 0;

function report(name, pass, detail) {
  const li = document.createElement('li');
  li.textContent = (pass ? 'PASS ' : 'FAIL ') + name + (detail ? ' — ' + detail : '');
  results.appendChild(li);
  if (!pass) failures++;
}

function check(name, resp, target, expected, circular) {
  if (!resp.ok) { report(name, false, resp.error); return; }
  const r = resp.results.find(x => x.target === target);
  if (!r) { report(name, false, 'no result for ' + target); return; }
  const v = r.value;
  let pass = v.type === expected.type && v.value === expected.value;
  if (circular !== undefined) pass = pass && r.circular === circular;
  report(name, pass, pass ? '' : JSON.stringify(r));
}

try {
  const { evaluate, explain } = await loadEngine();
  check('arithmetic', evaluate({ grid: {}, formula: '=1+1' }), 'formula', { type: 'number', value: 2 });
  check('coercion', evaluate({ grid: {}, formula: '=SUM("3",4)' }), 'formula', { type: 'number', value: 7 });
  check('lazy IF', evaluate({ grid: {}, formula: '=IF(TRUE,1,1/0)' }), 'formula', { type: 'number', value: 1 });
  check('decimal ROUND', evaluate({ grid: {}, formula: '=ROUND(2.675,2)' }), 'formula', { type: 'number', value: 2.68 });
  check('leftmost error', evaluate({ grid: { A1: { error: '#N/A' } }, formula: '=1/0+A1' }), 'formula', { type: 'error', value: '#DIV/0!' });
  check('TEXT format', evaluate({ grid: {}, formula: '=TEXT(1234.567,"#,##0.00")' }), 'formula', { type: 'text', value: '1,234.57' });
  check('VLOOKUP', evaluate({ grid: { A1: 1, B1: 10, A2: 2, B2: 20 }, formula: '=VLOOKUP(2,A1:B2,2,FALSE)' }), 'formula', { type: 'number', value: 20 });
  check('XLOOKUP exact', evaluate({ grid: { A1: 'a', A2: 'b', B1: 1, B2: 2 }, formula: '=XLOOKUP("b",A1:A2,B1:B2)' }), 'formula', { type: 'number', value: 2 });
  check('IFS lazy', evaluate({ grid: {}, formula: '=IFS(FALSE,1,TRUE,2)' }), 'formula', { type: 'number', value: 2 });
  check('SWITCH match', evaluate({ grid: {}, formula: '=SWITCH(2,1,"one",2,"two")' }), 'formula', { type: 'text', value: 'two' });
  check('TEXTJOIN', evaluate({ grid: {}, formula: '=TEXTJOIN("-",TRUE,"a","b")' }), 'formula', { type: 'text', value: 'a-b' });
  check('EOMONTH', evaluate({ grid: {}, formula: '=DAY(EOMONTH(DATE(2026,11,15),0))' }), 'formula', { type: 'number', value: 30 });
  check('TEXT scientific', evaluate({ grid: {}, formula: '=TEXT(12345,"0.00E+00")' }), 'formula', { type: 'text', value: '1.23E+04' });
  check('TEXT elapsed', evaluate({ grid: {}, formula: '=TEXT(1.5,"[h]:mm")' }), 'formula', { type: 'text', value: '36:00' });
  check('TEXT conditional', evaluate({ grid: {}, formula: '=TEXT(50,"[>100]""big"";""small""")' }), 'formula', { type: 'text', value: 'small' });
  check('Lotus DATE', evaluate({ grid: {}, formula: '=DATE(1900,2,29)' }), 'formula', { type: 'number', value: 60 });
  check('clock injection', evaluate({ grid: {}, formula: '=TODAY()', now: 46340 }), 'formula', { type: 'number', value: 46340 });
  const circ = evaluate({ grid: { D1: { formula: '=D1+1' }, D2: { formula: '=D1+5' } } });
  check('circular cell = 0', circ, 'D1', { type: 'number', value: 0 }, true);
  check('dependent of cycle', circ, 'D2', { type: 'number', value: 5 }, false);
  const bad = evaluate({ grid: {}, formula: '=1+' });
  report('parse error rejected', bad.ok === false, bad.ok ? 'unexpected ok' : '');
  const gresp = evaluate({ grid: { A1: 1, B1: { formula: '=A1+"A1"' }, C1: { formula: '=SUM(A1:A2)' } } });
  report('graph precedents AST-level', gresp.ok && JSON.stringify(gresp.graph.precedents.B1) === '["A1"]' && JSON.stringify(gresp.graph.precedents.C1) === '["A1","A2"]', JSON.stringify(gresp.graph));
  const ex1 = explain({ grid: { A1: { formula: '=1/0' }, B1: { formula: '=A1+1' } }, addr: 'B1' });
  report('explain sources', ex1.ok && JSON.stringify(ex1.sources) === '["A1"]' && ex1.steps.length === 2 && ex1.steps[0].is_source === true, JSON.stringify(ex1));
  const ex2 = explain({ grid: { A1: { formula: '=1/0' }, A2: { formula: '="x"+1' }, B1: { formula: '=A1+A2' } }, addr: 'B1' });
  report('explain leftmost source', ex2.ok && JSON.stringify(ex2.sources) === '["A1"]', JSON.stringify(ex2.sources));
  const ex3 = explain({ grid: { A1: 1, B1: { formula: '=A1+1' } }, addr: 'B1' });
  report('explain non-error empty', ex3.ok && ex3.steps.length === 0, JSON.stringify(ex3));
  report('csv quotes/escapes', JSON.stringify(parseCsv('a,"b""c",d')) === '[["a","b\\"c","d"]]', JSON.stringify(parseCsv('a,"b""c",d')));
  report('csv crlf', JSON.stringify(parseCsv('a,b\r\nc,d\r\n')) === '[["a","b"],["c","d"]]', JSON.stringify(parseCsv('a,b\r\nc,d\r\n')));
  report('csv empty fields', JSON.stringify(parseCsv(',a\nb,')) === '[["","a"],["b",""]]', JSON.stringify(parseCsv(',a\nb,')));
  done.textContent = failures === 0 ? 'SMOKE PASS' : 'SMOKE FAIL';
} catch (err) {
  report('engine load', false, err.message);
  done.textContent = 'SMOKE FAIL';
}
</script>
</body>
</html>
